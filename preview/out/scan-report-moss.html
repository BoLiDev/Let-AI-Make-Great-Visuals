<style>/*
 * 报告组件层。叠加在 Basecoat 之上，补充 shadcn 没有的报告类组件和页面布局。
 * 规则：颜色只引用 shadcn 变量和下面的语义变量；间距、字号只取下面的刻度。
 * 主题文件（themes/*.css）通过覆盖变量来换肤，不改这里的规则。
 */

:root {
  /* 间距刻度 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 72px;

  /* 字号刻度 */
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 30px;

  --page-width: 1120px;

  /* 中文回退字体：排在主题的拉丁字体之后 */
  --font-cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Zen Hei";

  /* 严重程度：有序色阶，从红到灰。fill 用于图形，fg 用于文字。 */
  --sev-blocker: oklch(0.55 0.21 27);
  --sev-high: oklch(0.7 0.17 55);
  --sev-medium: oklch(0.82 0.13 88);
  --sev-low: oklch(0.82 0.01 250);
  --sev-blocker-fg: oklch(0.48 0.19 27);
  --sev-high-fg: oklch(0.5 0.13 55);
  --sev-medium-fg: oklch(0.47 0.09 88);
  --sev-low-fg: var(--muted-foreground);

  --positive-fg: oklch(0.48 0.12 155);
  --link: var(--foreground);
  --heading-weight: 600;
  --heading-tracking: -0.01em;

  /* 主题可调的结构变量 */
  --title-size: var(--text-xl);
  --rule: 1px solid var(--border);        /* 分区线 */
  --rule-strong: 1px solid var(--border); /* 表格和概览的顶线 */
  --overview-bg: transparent;
  --overview-pad-x: 0px;
  --overview-radius: 0px;
  --bar-radius: 1px;
  --row-pad: var(--space-3);
}

.dark {
  --sev-blocker: oklch(0.65 0.2 27);
  --sev-high: oklch(0.72 0.16 55);
  --sev-medium: oklch(0.8 0.13 88);
  --sev-low: oklch(0.45 0.01 250);
  --sev-blocker-fg: oklch(0.75 0.16 27);
  --sev-high-fg: oklch(0.8 0.13 55);
  --sev-medium-fg: oklch(0.85 0.11 88);
  --positive-fg: oklch(0.78 0.14 155);
}

body {
  font-family: var(--font-sans), var(--font-cjk), sans-serif;
  font-size: var(--text-base);
  line-height: 1.55;
  background: var(--background);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.r-mono {
  font-family: var(--font-mono), var(--font-cjk), monospace;
  font-size: 0.93em;
  font-feature-settings: "zero" 0;
}

.r-num {
  font-variant-numeric: tabular-nums;
}

.r-muted {
  color: var(--muted-foreground);
}

.r-icon {
  display: inline-flex;
  flex: none;
  width: 1em;
  height: 1em;
  font-size: 16px;
  vertical-align: -0.15em;
}

.r-icon > svg {
  width: 100%;
  height: 100%;
  stroke-width: 1.75;
}

.r-link {
  color: var(--link);
  text-decoration: underline;
  text-decoration-color: color-mix(in oklch, currentColor 30%, transparent);
  text-underline-offset: 3px;
  border-radius: 2px;
}

.r-link:hover {
  text-decoration-color: currentColor;
}

:where(a, button, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

/* ---------- 页面骨架 ---------- */

.r-page {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 0 var(--space-5) var(--space-8);
}

.r-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-1) var(--space-4);
  min-width: 0;
}

.r-meta > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.r-meta .r-icon {
  font-size: 14px;
}

.r-meta strong {
  color: var(--foreground);
  font-weight: 500;
}

.r-header {
  padding: var(--space-7) 0 var(--space-6);
}

.r-eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-eyebrow a:hover {
  color: var(--foreground);
}

.r-title {
  font-family: var(--font-heading, var(--font-sans)), var(--font-cjk), sans-serif;
  font-size: var(--title-size);
  font-weight: var(--heading-weight);
  letter-spacing: var(--heading-tracking);
  line-height: 1.2;
  text-wrap: balance;
}

.r-title-sub {
  margin-left: var(--space-3);
  font-size: var(--text-md);
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted-foreground);
}

.r-lead {
  max-width: 46em;
  margin-top: var(--space-3);
  font-size: var(--text-md);
  line-height: 1.7;
  color: var(--muted-foreground);
  text-wrap: pretty;
}

.r-lead strong {
  color: var(--foreground);
  font-weight: 600;
}

.r-submeta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-5);
  margin-top: var(--space-4);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-submeta > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.r-lead .r-sev-text {
  color: var(--sev-blocker-fg);
  font-weight: 600;
}

.r-section {
  margin-top: var(--space-7);
}

.r-section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-3) var(--space-5);
  margin-bottom: var(--space-4);
}

.r-h2 {
  font-family: var(--font-heading, var(--font-sans)), var(--font-cjk), sans-serif;
  font-size: var(--text-md);
  font-weight: var(--heading-weight);
  letter-spacing: var(--heading-tracking);
}

.r-h2 small {
  margin-left: var(--space-2);
  font-size: var(--text-sm);
  font-weight: 400;
  color: var(--muted-foreground);
}

/* ---------- 概览：数字 + 分布 ---------- */

.r-overview {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: var(--space-7);
  align-items: start;
  padding: var(--space-5) var(--overview-pad-x);
  border-top: var(--rule-strong);
  border-bottom: var(--rule);
  border-radius: var(--overview-radius);
  background: var(--overview-bg);
}

.r-stats {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-5) var(--space-7);
}

.r-stat-label {
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-stat-value {
  margin-top: var(--space-1);
  font-family: var(--font-heading, var(--font-sans)), var(--font-cjk), sans-serif;
  font-size: var(--text-xl);
  font-weight: var(--heading-weight);
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.r-stat-value small {
  margin-left: 2px;
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted-foreground);
}





/* 左侧只有几个数字时，让数字列按内容收窄，分布条占满其余宽度 */
.r-overview[data-layout="stats"] {
  grid-template-columns: max-content minmax(0, 1fr);
}

/* 严重程度分布条 */

.r-sevbar {
  display: flex;
  height: 10px;
  overflow: hidden;
  border-radius: var(--bar-radius);
}

/* 各段首尾相接，圆角只在整条的两端 */
.r-sevbar > span {
  min-width: 3px;
  background: var(--sev-low);
}

.r-sevbar > [data-sev="blocker"] { background: var(--sev-blocker); }
.r-sevbar > [data-sev="high"] { background: var(--sev-high); }
.r-sevbar > [data-sev="medium"] { background: var(--sev-medium); }
.r-sevbar > [data-sev="low"] { background: var(--sev-low); }

.r-sevbar[data-size="sm"] {
  height: 6px;
}

.r-legend {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.r-legend-item dt {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-legend-item dd {
  margin-top: 2px;
  font-size: var(--text-lg);
  font-weight: var(--heading-weight);
  font-variant-numeric: tabular-nums;
}

.r-legend-item dd small {
  margin-left: var(--space-2);
  font-size: var(--text-xs);
  font-weight: 400;
  color: var(--muted-foreground);
}

.r-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 2px;
  background: var(--sev-low);
}

.r-dot[data-sev="blocker"] { background: var(--sev-blocker); }
.r-dot[data-sev="high"] { background: var(--sev-high); }
.r-dot[data-sev="medium"] { background: var(--sev-medium); }

/* 按种类的条形列表 */

.r-bars {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) max-content;
  gap: var(--space-2) var(--space-4);
  align-items: center;
  font-size: var(--text-sm);
}

.r-bars-track {
  height: 6px;
}

.r-bars-fill {
  display: block;
  height: 100%;
  min-width: 3px;
  border-radius: var(--bar-radius);
  background: var(--sev-low);
}

.r-bars-fill[data-sev="blocker"] { background: var(--sev-blocker); }
.r-bars-fill[data-sev="high"] { background: var(--sev-high); }
.r-bars-fill[data-sev="medium"] { background: var(--sev-medium); }

.r-bars-value {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ---------- 严重程度标签 ---------- */

.r-sev {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--sev-low-fg);
}

.r-sev .r-icon {
  font-size: 15px;
}

.r-sev[data-sev="blocker"] { color: var(--sev-blocker-fg); }
.r-sev[data-sev="high"] { color: var(--sev-high-fg); }
.r-sev[data-sev="medium"] { color: var(--sev-medium-fg); }

/* ---------- 工具条 ---------- */

.r-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
}

.r-search {
  position: relative;
  width: 240px;
}

.r-search .r-icon {
  position: absolute;
  top: 50%;
  left: 10px;
  translate: 0 -50%;
  color: var(--muted-foreground);
  pointer-events: none;
}

.r-search .input {
  width: 100%;
  padding-left: 32px;
}

.r-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.r-chip-count {
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
  opacity: 0.6;
}


/* ---------- 表格 ---------- */

.r-table-wrap {
  position: relative;
  overflow-x: auto;
  border-top: var(--rule-strong);
}

.r-table {
  width: 100%;
  font-size: var(--text-base);
}

.r-table th {
  height: 40px;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--muted-foreground);
  white-space: nowrap;
}

.r-table th,
.r-table td {
  padding-inline: var(--space-3);
}

.r-table th:last-child,
.r-table td:last-child {
  padding-right: var(--space-4);
}

.r-table td {
  padding-block: var(--row-pad);
  vertical-align: middle;
}

.r-table .is-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.r-table .is-zero {
  color: color-mix(in oklch, var(--muted-foreground) 55%, transparent);
}

.r-table tbody tr[data-href] {
  cursor: pointer;
  transition: background-color 120ms ease;
}

/* 可点击的行：悬停或键盘聚焦时整行变灰，标题加下划线。不用箭头图标。 */
.r-table tbody tr[data-href]:hover,
.r-table tbody tr[data-href]:focus-within {
  background: var(--muted);
}

.r-table tbody tr[data-href]:hover .r-app-name,
.r-app-name:focus-visible {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.r-sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: -4px -6px;
  padding: 4px 6px;
  border-radius: calc(var(--radius) - 4px);
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.r-sort:hover,
.r-sort[aria-sort] {
  color: var(--foreground);
}

.r-sort .r-icon {
  font-size: 13px;
  opacity: 0.55;
}

.r-sort[data-active] .r-icon {
  opacity: 1;
}

.r-app-name {
  font-weight: 500;
}

.r-app-path {
  display: block;
  margin-top: 1px;
  font-size: var(--text-xs);
  color: var(--muted-foreground);
}

.r-cell-bar {
  width: 22%;
  min-width: 140px;
}


.r-issue-title {
  font-weight: 500;
}

.r-issue-desc {
  margin-top: 2px;
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-loc {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  max-width: 100%;
}

.r-loc .r-icon {
  font-size: 13px;
  align-self: center;
  opacity: 0.6;
}

.r-when {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.r-when-sub {
  display: flex;
  gap: var(--space-2);
  margin-top: 2px;
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}


.r-count-note {
  margin-top: var(--space-3);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

/* ---------- 空状态 ---------- */

.r-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-7) var(--space-5);
  border-bottom: 1px solid var(--border);
  text-align: center;
  color: var(--muted-foreground);
}

.r-empty .r-icon {
  font-size: 22px;
}

.r-empty strong {
  color: var(--foreground);
  font-weight: 500;
}

/* ---------- 无问题的子应用 ---------- */

.r-clean {
  margin-top: var(--space-5);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

.r-clean summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 2px;
  cursor: pointer;
  list-style: none;
}

.r-clean summary::-webkit-details-marker {
  display: none;
}

.r-clean summary:hover {
  color: var(--foreground);
}

.r-clean summary .r-chevron {
  transition: rotate 120ms ease;
}

.r-clean[open] summary .r-chevron {
  rotate: 90deg;
}

.r-clean ul {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-1) var(--space-5);
  margin-top: var(--space-3);
  padding-left: 22px;
}

.r-footer {
  margin-top: var(--space-8);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
  font-size: var(--text-sm);
  color: var(--muted-foreground);
}

/* ---------- 窄屏与打印 ---------- */

@media (max-width: 820px) {
  .r-overview,
  .r-overview[data-layout="stats"] {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-5);
  }

  .r-legend {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .r-hide-narrow {
    display: none;
  }

  .r-search {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

@media print {
  .r-toolbar,
  .r-topbar button {
    display: none !important;
  }

  .r-page {
    max-width: none;
    padding: 0;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

ng","team":"交易前端组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/logistics-tracking","issues":[]},{"id":"live-stream","name":"直播","path":"apps/live-stream","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/live-stream","issues":[]},{"id":"member","name":"会员","path":"apps/member","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/member","issues":[]},{"id":"points-mall","name":"积分商城","path":"apps/points-mall","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/points-mall","issues":[]},{"id":"about","name":"关于我们","path":"apps/about","team":"基础体验组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/about","issues":[]}]};window.ICONS={"octagon-alert":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 16h.01\" /> <path d=\"M12 8v4\" /> <path d=\"M15.312 2a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586l-4.688-4.688A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2z\" /> </svg>","triangle-alert":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\" /> <path d=\"M12 9v4\" /> <path d=\"M12 17h.01\" /> </svg>","circle-alert":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"10\" /> <line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\" /> <line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\" /> </svg>","info":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M12 16v-4\" /> <path d=\"M12 8h.01\" /> </svg>","arrow-up":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m5 12 7-7 7 7\" /> <path d=\"M12 19V5\" /> </svg>","arrow-down":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v14\" /> <path d=\"m19 12-7 7-7-7\" /> </svg>","arrow-up-down":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 16-4 4-4-4\" /> <path d=\"M17 20V4\" /> <path d=\"m3 8 4-4 4 4\" /> <path d=\"M7 4v16\" /> </svg>","folder-git-2":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M18 19a5 5 0 0 1-5-5v8\" /> <path d=\"M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5\" /> <circle cx=\"13\" cy=\"12\" r=\"2\" /> <circle cx=\"20\" cy=\"19\" r=\"2\" /> </svg>","git-branch":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M15 6a9 9 0 0 0-9 9V3\" /> <circle cx=\"18\" cy=\"6\" r=\"3\" /> <circle cx=\"6\" cy=\"18\" r=\"3\" /> </svg>","git-commit-horizontal":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"3\" /> <line x1=\"3\" x2=\"9\" y1=\"12\" y2=\"12\" /> <line x1=\"15\" x2=\"21\" y1=\"12\" y2=\"12\" /> </svg>","sun":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"4\" /> <path d=\"M12 2v2\" /> <path d=\"M12 20v2\" /> <path d=\"m4.93 4.93 1.41 1.41\" /> <path d=\"m17.66 17.66 1.41 1.41\" /> <path d=\"M2 12h2\" /> <path d=\"M20 12h2\" /> <path d=\"m6.34 17.66-1.41 1.41\" /> <path d=\"m19.07 4.93-1.41 1.41\" /> </svg>","moon":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401\" /> </svg>","search-x":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m13.5 8.5-5 5\" /> <path d=\"m8.5 8.5 5 5\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" /> <path d=\"m21 21-4.3-4.3\" /> </svg>","search":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 21-4.34-4.34\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" /> </svg>","chevron-right":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m9 18 6-6-6-6\" /> </svg>","external-link":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M15 3h6v6\" /> <path d=\"M10 14 21 3\" /> <path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\" /> </svg>","users":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" /> <path d=\"M16 3.128a4 4 0 0 1 0 7.744\" /> <path d=\"M22 21v-2a4 4 0 0 0-3-3.87\" /> <circle cx=\"9\" cy=\"7\" r=\"4\" /> </svg>"};</script>
<script>/* 扫描报告模板：渲染与交互。数据来自 window.REPORT（结构见同目录 README），图标来自 window.ICONS（构建时注入）。 */
(function () {
  const R = window.REPORT;
  const root = document.getElementById('app');

  // 严重程度是模板固定的四级，数据里只需要引用 id。
  const SEV = [
    { id: 'blocker', label: '阻断', icon: 'octagon-alert', hint: '发布前必须修复' },
    { id: 'high', label: '严重', icon: 'triangle-alert', hint: '本迭代内修复' },
    { id: 'medium', label: '一般', icon: 'circle-alert', hint: '排期修复' },
    { id: 'low', label: '提示', icon: 'info', hint: '建议优化' },
  ];
  const SEV_RANK = Object.fromEntries(SEV.map((s, i) => [s.id, i]));
  const SEV_BY_ID = Object.fromEntries(SEV.map((s) => [s.id, s]));
  const TYPE_BY_ID = Object.fromEntries(R.types.map((t) => [t.id, t]));

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (name, cls = '') => `<span class="r-icon ${cls}" aria-hidden="true">${window.ICONS[name] || ''}</span>`;
  const link = (url, inner, cls = 'r-link') => (url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : inner);

  function countBySev(issues) {
    const c = { blocker: 0, high: 0, medium: 0, low: 0 };
    for (const i of issues) c[i.severity]++;
    return c;
  }

  const scanDay = Date.parse(String(R.scannedAt || '').slice(0, 10));
  const ageOf = (date) => {
    const t = Date.parse(date);
    return Number.isNaN(t) || Number.isNaN(scanDay) ? null : Math.max(0, Math.round((scanDay - t) / 86400000));
  };

  // 预计算：补全每个问题的严重程度和距今天数，统计每个子应用。
  const apps = R.apps.map((a) => {
    const issues = (a.issues || []).map((i) => ({
      ...i,
      severity: i.severity || TYPE_BY_ID[i.type].severity,
      age: i.introducedAt ? ageOf(i.introducedAt) : null,
    }));
    return { ...a, issues, total: issues.length, sev: countBySev(issues) };
  });
  const dirty = apps.filter((a) => a.total > 0);
  const clean = apps.filter((a) => a.total === 0);
  const allIssues = apps.flatMap((a) => a.issues);
  const totals = countBySev(allIssues);
  const total = allIssues.length;
  const maxAppTotal = Math.max(1, ...dirty.map((a) => a.total));
  const hasTeam = apps.some((a) => a.team);
  const hasDate = allIssues.some((i) => i.introducedAt);

  const state = {
    list: { q: '', sort: 'blocker', dir: 'desc' },
    detail: { type: '', sev: '', sort: 'severity', dir: 'asc' },
  };

  function sevbar(counts, { size, scale = 1 } = {}) {
    const present = SEV.filter((s) => counts[s.id]);
    if (!present.length) return '';
    const label = present.map((s) => `${s.label} ${counts[s.id]}`).join('，');
    const segs = present.map((s) => `<span data-sev="${s.id}" style="flex:${counts[s.id]} 0 0"></span>`).join('');
    return `<div class="r-sevbar" ${size ? `data-size="${size}"` : ''} role="img" aria-label="${label}" title="${label}" style="width:${Math.max(scale * 100, 4)}%">${segs}</div>`;
  }

  const sevLabel = (id) => `<span class="r-sev" data-sev="${id}">${icon(SEV_BY_ID[id].icon)}${SEV_BY_ID[id].label}</span>`;

  function legend(counts, withHint) {
    return `<dl class="r-legend">${SEV.map((x) => `
      <div class="r-legend-item">
        <dt><span class="r-dot" data-sev="${x.id}"></span>${x.label}</dt>
        <dd class="${counts[x.id] ? '' : 'r-muted'}">${counts[x.id]}${withHint ? `<small>${x.hint}</small>` : ''}</dd>
      </div>`).join('')}</dl>`;
  }

  function ago(days) {
    if (days === null) return '';
    if (days <= 0) return '今天';
    if (days < 30) return `${days} 天前`;
    if (days < 365) return `${Math.floor(days / 30)} 个月前`;
    return `${Math.floor(days / 365)} 年前`;
  }

  function sortBtn(scope, key, label) {
    const s = state[scope];
    const active = s.sort === key;
    const ic = active ? (s.dir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down';
    return `<button type="button" class="r-sort" data-sort="${scope}:${key}" ${active ? 'data-active' : ''}>${label}${icon(ic)}</button>`;
  }

  const ariaSort = (scope, key) => (state[scope].sort === key ? `aria-sort="${state[scope].dir === 'asc' ? 'ascending' : 'descending'}"` : '');

  function topbar() {
    const dark = document.documentElement.classList.contains('dark');
    const tip = dark ? '切换到浅色' : '切换到深色';
    const repo = R.repo || {};
    return `
    <header class="r-topbar">
      <div class="r-meta">
        ${repo.name ? `<span>${icon('folder-git-2')}${link(repo.url, `<strong class="r-mono">${esc(repo.name)}</strong>`, '')}</span>` : ''}
        ${R.branch ? `<span>${icon('git-branch')}<span class="r-mono">${esc(R.branch)}</span></span>` : ''}
        ${R.commit ? `<span>${icon('git-commit-horizontal')}<span class="r-mono">${esc(R.commit)}</span></span>` : ''}
      </div>
      <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-action="theme" aria-label="${tip}" title="${tip}">${icon(dark ? 'sun' : 'moon')}</button>
    </header>`;
  }

  function typeBars(issues) {
    const counts = R.types.map((t) => ({ ...t, n: issues.filter((i) => i.type === t.id).length })).filter((t) => t.n).sort((a, b) => b.n - a.n);
    if (!counts.length) return '';
    const max = Math.max(...counts.map((t) => t.n));
    return `<div class="r-bars">${counts.map((t) => `
      <span>${esc(t.label)}</span>
      <span class="r-bars-track"><span class="r-bars-fill" data-sev="${t.severity}" style="width:${(t.n / max) * 100}%"></span></span>
      <span class="r-bars-value">${t.n}</span>`).join('')}</div>`;
  }

  /* ---------- 列表页 ---------- */

  function listLead() {
    if (!total) return `共扫描 ${apps.length} 个子应用，<strong>未发现问题</strong>。`;
    const blockerApps = dirty.filter((a) => a.sev.blocker).length;
    const head = `${apps.length} 个子应用中有 <strong>${dirty.length} 个</strong>存在问题，共 <strong>${total} 个</strong>。`;
    return totals.blocker
      ? `${head}其中 <span class="r-sev-text">${totals.blocker} 个阻断级问题</span>分布在 ${blockerApps} 个子应用，需要在下次发布前修复。`
      : `${head}没有阻断级问题。`;
  }

  function listTable() {
    const { q, sort, dir } = state.list;
    const kw = q.trim().toLowerCase();
    const key = sort === 'blocker' ? (a) => a.sev.blocker * 100000 + a.total : (a) => a.total;
    const rows = dirty
      .filter((a) => !kw || [a.id, a.name, a.path, a.team].some((v) => v && String(v).toLowerCase().includes(kw)))
      .sort((a, b) => (dir === 'asc' ? key(a) - key(b) : key(b) - key(a)));
    if (!rows.length) {
      return `<div class="r-empty">${icon('search-x')}<strong>没有匹配的子应用</strong><span>换一个关键词试试。</span>
        <button type="button" class="btn" data-variant="outline" data-size="sm" data-action="reset-list">清除搜索</button></div>`;
    }
    return `
    <table class="table r-table">
      <thead>
        <tr>
          <th scope="col">子应用</th>
          ${hasTeam ? '<th scope="col" class="r-hide-narrow">负责团队</th>' : ''}
          <th scope="col" class="is-num" ${ariaSort('list', 'blocker')}>${sortBtn('list', 'blocker', '阻断')}</th>
          <th scope="col" class="is-num" ${ariaSort('list', 'total')}>${sortBtn('list', 'total', '问题数')}</th>
          <th scope="col" class="r-cell-bar r-hide-narrow">严重程度分布</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((a) => `
        <tr data-href="#/app/${encodeURIComponent(a.id)}">
          <td><a class="r-app-name" href="#/app/${encodeURIComponent(a.id)}">${esc(a.name)}</a>${a.path ? `<span class="r-app-path r-mono">${esc(a.path)}</span>` : ''}</td>
          ${hasTeam ? `<td class="r-hide-narrow r-muted">${esc(a.team || '')}</td>` : ''}
          ${a.sev.blocker ? `<td class="is-num"><span class="r-sev" data-sev="blocker">${a.sev.blocker}</span></td>` : '<td class="is-num is-zero">0</td>'}
          <td class="is-num">${a.total}</td>
          <td class="r-cell-bar r-hide-narrow">${sevbar(a.sev, { size: 'sm', scale: a.total / maxAppTotal })}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  function renderList() {
    const header = `
    ${topbar()}
    <div class="r-header">
      <h1 class="r-title">${esc(R.title || '代码扫描报告')}</h1>
      <p class="r-lead">${listLead()}</p>
    </div>`;
    if (!total) {
      root.innerHTML = header;
      return;
    }
    root.innerHTML = `
    ${header}
    <section class="r-overview" data-layout="stats" aria-label="概览">
      <div class="r-stats">
        <div class="r-stat">
          <div class="r-stat-label">问题总数</div>
          <div class="r-stat-value">${total}</div>
        </div>
        <div class="r-stat">
          <div class="r-stat-label">受影响子应用</div>
          <div class="r-stat-value">${dirty.length}<small>/ ${apps.length}</small></div>
        </div>
      </div>
      <div>${sevbar(totals)}${legend(totals, true)}</div>
    </section>

    <section class="r-section">
      <div class="r-section-head">
        <h2 class="r-h2">存在问题的子应用<small>${dirty.length} 个</small></h2>
        <label class="r-search">${icon('search')}<span class="sr-only">搜索子应用</span>
          <input class="input" type="search" placeholder="搜索子应用" value="${esc(state.list.q)}" data-input="list-q"></label>
      </div>
      <div class="r-table-wrap" id="list-table">${listTable()}</div>
      ${clean.length ? `
      <details class="r-clean">
        <summary>${icon('chevron-right', 'r-chevron')}另有 ${clean.length} 个子应用未发现问题</summary>
        <ul>${clean.map((a) => `<li>${esc(a.name)}${a.path ? ` <span class="r-mono">${esc(a.path)}</span>` : ''}</li>`).join('')}</ul>
      </details>` : ''}
    </section>

    <section class="r-section">
      <div class="r-section-head"><h2 class="r-h2">问题种类<small>颜色表示该种类的严重程度</small></h2></div>
      ${typeBars(allIssues)}
    </section>
    ${R.footnote ? `<footer class="r-footer">${esc(R.footnote)}</footer>` : ''}`;
  }

  /* ---------- 详情页 ---------- */

  function detailTable(app) {
    const { type, sev, sort, dir } = state.detail;
    const key = sort === 'severity' ? (i) => SEV_RANK[i.severity] * 100000 + (i.age ?? 99999) : (i) => i.age ?? 99999;
    const rows = app.issues
      .filter((i) => (!type || i.type === type) && (!sev || i.severity === sev))
      .sort((a, b) => (dir === 'asc' ? key(a) - key(b) : key(b) - key(a)));
    if (!rows.length) {
      return `<div class="r-empty">${icon('search-x')}<strong>没有符合条件的问题</strong><span>当前筛选条件下没有结果。</span>
        <button type="button" class="btn" data-variant="outline" data-size="sm" data-action="reset-detail">清除筛选</button></div>`;
    }
    const prefix = app.path ? app.path.replace(/\/?$/, '/') : '';
    const loc = (i) => {
      const short = prefix && i.file.startsWith(prefix) ? i.file.slice(prefix.length) : i.file;
      const text = `${esc(short)}${i.line ? `:${i.line}` : ''}`;
      return i.url
        ? `<a class="r-loc r-link r-mono" href="${esc(i.url)}" target="_blank" rel="noopener" title="在代码仓库中查看">${text}${icon('external-link')}</a>`
        : `<span class="r-loc r-mono">${text}</span>`;
    };
    const when = (i) => {
      if (!i.introducedAt) return '';
      const sub = [ago(i.age), i.author && esc(i.author), i.mr && `<span class="r-mono">${esc(i.mr)}</span>`].filter(Boolean);
      return `${esc(i.introducedAt)}${sub.length ? `<span class="r-when-sub">${sub.map((x) => `<span>${x}</span>`).join('')}</span>` : ''}`;
    };
    return `
    <table class="table r-table">
      <thead>
        <tr>
          <th scope="col" ${ariaSort('detail', 'severity')}>${sortBtn('detail', 'severity', '严重程度')}</th>
          <th scope="col">问题</th>
          <th scope="col">位置</th>
          ${hasDate ? `<th scope="col" ${ariaSort('detail', 'time')}>${sortBtn('detail', 'time', '引入时间')}</th>` : ''}
        </tr>
      </thead>
      <tbody>
        ${rows.map((i) => `
        <tr>
          <td>${sevLabel(i.severity)}</td>
          <td>
            <div class="r-issue-title">${esc(TYPE_BY_ID[i.type].label)}</div>
            ${i.message ? `<div class="r-issue-desc">${esc(i.message)}</div>` : ''}
          </td>
          <td>${loc(i)}</td>
          ${hasDate ? `<td class="r-when">${when(i)}</td>` : ''}
        </tr>`).join('')}
      </tbody>
    </table>
    ${rows.length < app.total ? `<p class="r-count-note">显示 ${rows.length} / ${app.total} 个问题</p>` : ''}`;
  }

  function detailFilters(app) {
    const d = state.detail;
    const types = R.types.map((t) => ({ ...t, n: app.issues.filter((i) => i.type === t.id).length })).filter((t) => t.n);
    const chip = (id, label, n) => `<button type="button" class="btn" data-size="sm" data-variant="${d.type === id ? 'primary' : 'outline'}" aria-pressed="${d.type === id}" data-type="${esc(id)}">${esc(label)}<span class="r-chip-count">${n}</span></button>`;
    return `
      <div class="r-chips" role="group" aria-label="按种类筛选">
        ${chip('', '全部', app.total)}${types.map((t) => chip(t.id, t.label, t.n)).join('')}
      </div>
      <select class="select" aria-label="严重程度" data-input="detail-sev">
        <option value="">全部严重程度</option>
        ${SEV.filter((x) => app.sev[x.id]).map((x) => `<option value="${x.id}" ${x.id === d.sev ? 'selected' : ''}>${x.label}（${app.sev[x.id]}）</option>`).join('')}
      </select>`;
  }

  function renderDetail(app) {
    const submeta = [
      app.team && `<span>${icon('users')}${esc(app.team)}</span>`,
      app.url && `<span>${link(app.url, '在代码仓库中打开目录')}${icon('external-link')}</span>`,
    ].filter(Boolean).join('');
    root.innerHTML = `
    ${topbar()}
    <div class="r-header">
      <nav class="r-eyebrow" aria-label="面包屑">
        <a href="#/">${esc(R.title || '代码扫描报告')}</a>${icon('chevron-right')}<span>${esc(app.name)}</span>
      </nav>
      <h1 class="r-title">${esc(app.name)}${app.path ? `<span class="r-title-sub r-mono">${esc(app.path)}</span>` : ''}</h1>
      <p class="r-lead">共 <strong>${app.total} 个</strong>问题${app.sev.blocker ? `，其中 <span class="r-sev-text">${app.sev.blocker} 个阻断级</span>需要在下次发布前修复` : '，没有阻断级问题'}。</p>
      ${submeta ? `<div class="r-submeta">${submeta}</div>` : ''}
    </div>

    <section class="r-overview" aria-label="概览">
      <div>${sevbar(app.sev)}${legend(app.sev, false)}</div>
      ${typeBars(app.issues)}
    </section>

    <section class="r-section">
      <div class="r-section-head" id="detail-filters">${detailFilters(app)}</div>
      <div class="r-table-wrap" id="detail-table">${detailTable(app)}</div>
    </section>`;
  }

  /* ---------- 路由与事件 ---------- */

  function currentApp() {
    const m = location.hash.match(/^#\/app\/(.+)$/);
    if (!m) return null;
    const id = decodeURIComponent(m[1]);
    return apps.find((a) => String(a.id) === id && a.total > 0) || null;
  }

  function render() {
    const app = currentApp();
    if (app) renderDetail(app);
    else renderList();
    const title = R.title || '代码扫描报告';
    document.title = app ? `${app.name} | ${title}` : title;
  }

  let lastApp = null;
  window.addEventListener('hashchange', () => {
    const app = currentApp();
    if (app && app.id !== lastApp) state.detail = { type: '', sev: '', sort: 'severity', dir: 'asc' };
    lastApp = app ? app.id : null;
    render();
    window.scrollTo(0, 0);
  });

  const refreshList = () => (document.getElementById('list-table').innerHTML = listTable());
  function refreshDetail(withFilters) {
    const app = currentApp();
    if (withFilters) document.getElementById('detail-filters').innerHTML = detailFilters(app);
    document.getElementById('detail-table').innerHTML = detailTable(app);
  }

  root.addEventListener('input', (e) => {
    const k = e.target.dataset.input;
    if (k === 'list-q') { state.list.q = e.target.value; refreshList(); }
    if (k === 'detail-sev') { state.detail.sev = e.target.value; refreshDetail(); }
  });

  root.addEventListener('click', (e) => {
    const sortEl = e.target.closest('[data-sort]');
    if (sortEl) {
      const [scope, key] = sortEl.dataset.sort.split(':');
      const s = state[scope];
      if (s.sort === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.sort = key; s.dir = scope === 'list' ? 'desc' : 'asc'; }
      scope === 'list' ? refreshList() : refreshDetail();
      return;
    }
    const typeEl = e.target.closest('[data-type]');
    if (typeEl) { state.detail.type = typeEl.dataset.type; refreshDetail(true); return; }
    const action = e.target.closest('[data-action]');
    if (action) {
      const a = action.dataset.action;
      if (a === 'theme') {
        const dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('report-theme', dark ? 'dark' : 'light'); } catch (_) {}
        render();
      }
      if (a === 'reset-list') { state.list.q = ''; render(); }
      if (a === 'reset-detail') { Object.assign(state.detail, { type: '', sev: '' }); refreshDetail(true); }
      return;
    }
    const row = e.target.closest('tr[data-href]');
    if (row && !e.target.closest('a, button')) location.hash = row.dataset.href;
  });

  lastApp = currentApp() ? currentApp().id : null;
  window.__rerender = render;
  render();
})();
</script>

</body>
</html>
