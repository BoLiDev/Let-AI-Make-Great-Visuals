:root {
  --font-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Zen Hei", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", monospace;

  --bg: oklch(0.975 0.003 250);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.965 0.004 250);
  --fg: oklch(0.21 0.015 255);
  --fg-2: oklch(0.38 0.015 255);
  --fg-3: oklch(0.52 0.012 255);
  --line: oklch(0.915 0.005 250);
  --line-2: oklch(0.86 0.008 250);
  --link: oklch(0.42 0.13 255);
  --ring: oklch(0.6 0.15 255);
  --hover: oklch(0.96 0.008 250);
  --shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.05);

  /* 严重程度：fill 画图形，fg 写文字，bg 做浅底 */
  --blocker: oklch(0.57 0.215 27);
  --high: oklch(0.72 0.165 55);
  --medium: oklch(0.84 0.14 90);
  --low: oklch(0.8 0.012 250);
  --blocker-fg: oklch(0.5 0.2 27);
  --high-fg: oklch(0.5 0.13 50);
  --medium-fg: oklch(0.47 0.09 85);
  --low-fg: oklch(0.5 0.012 255);
  --blocker-bg: oklch(0.965 0.02 27);
}

.dark {
  --bg: oklch(0.17 0.008 255);
  --surface: oklch(0.21 0.01 255);
  --surface-2: oklch(0.245 0.011 255);
  --fg: oklch(0.94 0.005 250);
  --fg-2: oklch(0.8 0.008 250);
  --fg-3: oklch(0.67 0.01 250);
  --line: oklch(0.29 0.011 255);
  --line-2: oklch(0.36 0.013 255);
  --link: oklch(0.8 0.1 250);
  --ring: oklch(0.7 0.13 250);
  --hover: oklch(0.25 0.012 255);
  --shadow: none;
  --blocker: oklch(0.65 0.2 27);
  --high: oklch(0.74 0.16 55);
  --medium: oklch(0.82 0.13 90);
  --low: oklch(0.46 0.012 250);
  --blocker-fg: oklch(0.76 0.16 27);
  --high-fg: oklch(0.8 0.13 55);
  --medium-fg: oklch(0.85 0.11 90);
  --low-fg: oklch(0.68 0.01 250);
  --blocker-bg: oklch(0.27 0.05 27);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
table { border-collapse: collapse; width: 100%; }
:where(a, button, summary, input):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }

.mono { font-family: var(--font-mono); font-size: 0.93em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.ic { display: inline-flex; flex: none; width: 1em; height: 1em; font-size: 15px; vertical-align: -0.15em; }
.ic > svg { width: 100%; height: 100%; stroke-width: 1.75; }

.page { max-width: 1184px; margin: 0 auto; padding: 0 32px 72px; }

/* ---------- 顶栏 ---------- */
.topbar { display: flex; align-items: center; gap: 20px; padding: 14px 0; font-size: 13px; color: var(--fg-3); }
.brand { font-size: 15px; font-weight: 650; color: var(--fg); letter-spacing: -0.01em; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 18px; min-width: 0; flex: 1; padding-left: 20px; border-left: 1px solid var(--line-2); }
.meta > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.meta .ic { font-size: 14px; }
.meta a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--fg-2); }
.iconbtn:hover { background: var(--hover); color: var(--fg); }

/* ---------- 概览 ---------- */
.overview {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.ov-main { padding: 24px 28px; min-width: 0; }
.ov-side { padding: 22px 24px 20px; border-left: 1px solid var(--line); min-width: 0; }

.headline { display: flex; flex-wrap: wrap; gap: 8px 44px; margin-bottom: 18px; }
.big-stat { display: flex; align-items: baseline; gap: 8px; }
.big-num { font-size: 40px; font-weight: 650; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big-num small { margin-left: 4px; font-size: 18px; font-weight: 450; letter-spacing: 0; color: var(--fg-3); }
.big-label { font-size: 14px; color: var(--fg-2); }

.sevbar { display: flex; gap: 2px; height: 8px; }
.sevbar > span { min-width: 3px; background: var(--low); }
.sevbar > span:first-child { border-radius: 99px 0 0 99px; }
.sevbar > span:last-child { border-radius: 0 99px 99px 0; }
.sevbar > span:only-child { border-radius: 99px; }
.sevbar > [data-sev="blocker"] { background: var(--blocker); }
.sevbar > [data-sev="high"] { background: var(--high); }
.sevbar > [data-sev="medium"] { background: var(--medium); }
.sevbar.lg { height: 12px; }
.sevbar.sm { height: 6px; gap: 1px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.tile {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: baseline;
  gap: 0 8px;
  padding: 10px 14px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.tile-label { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg-2); }
.tile-label i, .sev i { width: 8px; height: 8px; flex: none; border-radius: 2px; background: var(--low); }
.tile-num { font-size: 26px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile-pct { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
[data-sev="blocker"] > .tile-label i, .sev[data-sev="blocker"] i { background: var(--blocker); }
[data-sev="high"] > .tile-label i, .sev[data-sev="high"] i { background: var(--high); }
[data-sev="medium"] > .tile-label i, .sev[data-sev="medium"] i { background: var(--medium); }
.tile[data-sev="blocker"]:not([data-zero], :disabled) { border-color: color-mix(in oklch, var(--blocker) 35%, var(--line)); background: var(--blocker-bg); }
.tile[data-sev="blocker"]:not([data-zero], :disabled) .tile-num { color: var(--blocker-fg); }
.tile[data-zero] .tile-num, .tile:disabled .tile-num { color: var(--fg-3); }
button.tile { transition: border-color 0.12s, box-shadow 0.12s; }
button.tile:disabled { cursor: default; }
button.tile:not(:disabled):hover { border-color: var(--fg-3); }
button.tile[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }

.lead { margin-top: 16px; font-size: 14px; color: var(--fg-2); line-height: 1.7; }
.lead strong { font-weight: 600; color: var(--fg); }
.lead strong.danger { color: var(--blocker-fg); }
.lead a { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.lead a:hover { text-decoration-color: currentColor; }
.lead .jump { margin-left: 6px; font-weight: 400; color: var(--link); white-space: nowrap; }
.lead .jump .ic { font-size: 13px; margin-left: 2px; }

.side-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--fg); }
.side-title small { font-size: 12px; font-weight: 400; color: var(--fg-3); }
.types { display: grid; gap: 1px; margin: 0 -8px; }
.type-row {
  display: grid;
  grid-template-columns: 9.5em minmax(0, 1fr) 2.2em;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 13px;
}
.type-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.type-track { height: 8px; }
.type-fill { display: block; height: 100%; min-width: 3px; border-radius: 99px; background: var(--low); }
[data-sev="blocker"] > .type-track .type-fill { background: var(--blocker); }
[data-sev="high"] > .type-track .type-fill { background: var(--high); }
[data-sev="medium"] > .type-track .type-fill { background: var(--medium); }
.type-n { text-align: right; font-weight: 500; }
.type-row[data-sev="blocker"] .type-n { color: var(--blocker-fg); }
button.type-row:hover { background: var(--hover); }
button.type-row[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--fg-3); }

/* ---------- 详情页头部 ---------- */
.crumbs { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 12px; font-size: 13px; }
.back, .pager { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); white-space: nowrap; }
.back { margin-left: -10px; }
.back:hover, .pager:hover { background: var(--hover); color: var(--fg); }
.pagers { display: inline-flex; align-items: center; gap: 6px; }
.pagers > .muted { margin-right: 6px; }
.pager { border: 1px solid var(--line-2); background: var(--surface); }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: 30px; font-weight: 650; line-height: 1.2; letter-spacing: -0.02em; }
.title-n { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--fg-2); }
.title-n b { font-size: 20px; font-weight: 600; color: var(--fg); margin-right: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 28px; margin: 8px 0 18px; font-size: 13px; }
.facts > span { display: inline-flex; align-items: baseline; gap: 8px; }
.link { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in oklch, currentColor 35%, transparent); text-underline-offset: 3px; }
.link:hover { text-decoration-color: currentColor; }

/* ---------- 分区与工具条 ---------- */
.section { margin-top: 32px; scroll-margin-top: 16px; }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; min-height: 34px; margin-bottom: 10px; }
.section-head h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.section-head h2 small { font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; width: 260px; }
.search .ic { position: absolute; top: 50%; left: 10px; translate: 0 -50%; color: var(--fg-3); pointer-events: none; }
.search input {
  width: 100%;
  height: 34px;
  padding: 0 10px 0 32px;
  font: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 8px;
}
.search input::placeholder { color: var(--fg-3); }
.search input:focus { outline: 2px solid var(--ring); outline-offset: -1px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--fg-2); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 0 0 1px var(--line-2), var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px 0 9px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--fg); color: var(--bg); }
.chip .ic { font-size: 12px; opacity: 0.8; }
.btn { height: 32px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-size: 13px; }
.btn:hover { background: var(--hover); }

/* ---------- 表格 ---------- */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; vertical-align: baseline; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
.tbl thead th { padding-block: 9px; font-size: 12.5px; font-weight: 500; color: var(--fg-3); white-space: nowrap; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tbl thead th:first-child { border-top-left-radius: 11px; }
.tbl thead th:last-child { border-top-right-radius: 11px; }
.tbl tbody tr + tr > td { border-top: 1px solid var(--line); }
.tbl tbody + tbody > tr:first-child > th { border-top: 1px solid var(--line); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.n { width: 76px; }
.tbl td.zero { color: color-mix(in oklch, var(--fg-3) 50%, transparent); }
.tbl td.n[data-sev="blocker"] { color: var(--blocker-fg); font-weight: 600; }
.tbl td.total { font-weight: 600; }
.sortbtn { display: inline-flex; align-items: center; gap: 3px; margin: -3px -6px; padding: 3px 6px; border-radius: 6px; }
.sortbtn .ic { font-size: 12px; opacity: 0.45; }
.sortbtn:hover, .sortbtn[data-on] { color: var(--fg); }
.sortbtn[data-on] .ic { opacity: 1; }

.tbl-apps td { vertical-align: middle; }
.tbl-apps tbody tr { cursor: pointer; }
.tbl-apps tbody tr:hover, .tbl-apps tbody tr:focus-within { background: var(--hover); }
.tbl-apps tbody tr:hover .app-name { text-decoration: underline; text-underline-offset: 3px; }
.app-name { font-weight: 550; }
a.app-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.app-path { margin-left: 10px; font-size: 12px; color: var(--fg-3); }
.bar-col { width: 21%; min-width: 150px; }
td.bar-col { padding-left: 20px; }

.tbl-issues td { font-size: 13.5px; }
.grp th { padding-block: 14px 7px; font-size: 13.5px; font-weight: 400; background: var(--surface); }
.grp th > * { vertical-align: baseline; }
.grp-name { margin-left: 10px; font-size: 14px; font-weight: 600; }
.grp-n { margin-left: 8px; font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.tbl tbody .grp + tr > td { border-top: 0; }
.tbl-issues[data-mode="type"] td.msg { padding-left: 20px; color: var(--fg-2); }
.tbl-issues[data-mode="type"] tbody tr:last-child > td { padding-bottom: 13px; }
.msg .sev { margin-right: 8px; }
.issue-type { display: block; font-weight: 550; color: var(--fg); }
.issue-type .sev { margin-right: 10px; font-weight: 500; }
.issue-msg { display: block; margin-top: 1px; font-size: 13px; color: var(--fg-3); }
.tbl-issues tbody tr:not(.grp):hover { background: var(--hover); }

.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; color: var(--low-fg); }
.sev[data-sev="blocker"] { color: var(--blocker-fg); }
.sev[data-sev="high"] { color: var(--high-fg); }
.sev[data-sev="medium"] { color: var(--medium-fg); }

.loc { display: inline-block; font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
.loc-dir { color: var(--fg-3); }
.loc-file { color: var(--fg); font-weight: 500; }
a.loc .loc-file { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in oklch, currentColor 30%, transparent); text-underline-offset: 3px; }
a.loc .ic { margin-left: 5px; font-size: 12px; color: var(--fg-3); opacity: 0; }
a.loc:hover .loc-file { text-decoration-color: currentColor; }
a.loc:hover .loc-dir { color: var(--fg-2); }
tr:hover a.loc .ic, a.loc:focus-visible .ic { opacity: 1; }
.when, .who { white-space: nowrap; }
.when .sub, .who .sub { margin-left: 8px; font-size: 12px; color: var(--fg-3); }

/* ---------- 其他 ---------- */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 44px 24px; text-align: center; color: var(--fg-3); }
.empty .ic { font-size: 22px; }
.empty strong { font-weight: 500; color: var(--fg); }
.empty.big { padding: 96px 24px; }

.clean { margin-top: 12px; font-size: 13px; color: var(--fg-2); }
.clean summary { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 6px; cursor: pointer; list-style: none; }
.clean summary::-webkit-details-marker { display: none; }
.clean summary:hover { background: var(--hover); color: var(--fg); }
.clean summary .ic:first-child { transition: rotate 0.12s; }
.clean summary .ic + .ic { color: oklch(0.6 0.13 155); }
.clean[open] summary .ic:first-child { rotate: 90deg; }
.clean ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 20px; margin-top: 8px; padding: 0 0 0 26px; }
.clean li .mono { margin-left: 8px; font-size: 12px; color: var(--fg-3); }
.footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--fg-3); }

@media (max-width: 960px) {
  .page { padding-inline: 16px; }
  .overview { grid-template-columns: minmax(0, 1fr); }
  .ov-side { border-left: 0; border-top: 1px solid var(--line); }
  .ov-main { padding: 20px; }
  .narrow-hide { display: none; }
}
@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search { width: 100%; }
  .tools { width: 100%; }
  .meta { border-left: 0; padding-left: 0; }
  .topbar { flex-wrap: wrap; }
  .tbl td.n { width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  .search, .iconbtn, .seg, .pagers, .jump { display: none !important; }
  .page { max-width: none; padding: 0; }
  body { background: #fff; }
}
</style>

ng","team":"交易前端组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/logistics-tracking","issues":[]},{"id":"live-stream","name":"直播","path":"apps/live-stream","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/live-stream","issues":[]},{"id":"member","name":"会员","path":"apps/member","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/member","issues":[]},{"id":"points-mall","name":"积分商城","path":"apps/points-mall","team":"增长组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/points-mall","issues":[]},{"id":"about","name":"关于我们","path":"apps/about","team":"基础体验组","url":"https://gitlab.example.com/platform/web-monorepo/-/tree/main/apps/about","issues":[]}]};window.ICONS={"folder-git-2":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M18 19a5 5 0 0 1-5-5v8\" /> <path d=\"M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5\" /> <circle cx=\"13\" cy=\"12\" r=\"2\" /> <circle cx=\"20\" cy=\"19\" r=\"2\" /> </svg>","git-branch":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M15 6a9 9 0 0 0-9 9V3\" /> <circle cx=\"18\" cy=\"6\" r=\"3\" /> <circle cx=\"6\" cy=\"18\" r=\"3\" /> </svg>","git-commit-horizontal":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"3\" /> <line x1=\"3\" x2=\"9\" y1=\"12\" y2=\"12\" /> <line x1=\"15\" x2=\"21\" y1=\"12\" y2=\"12\" /> </svg>","clock":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M12 6v6l4 2\" /> </svg>","sun":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"4\" /> <path d=\"M12 2v2\" /> <path d=\"M12 20v2\" /> <path d=\"m4.93 4.93 1.41 1.41\" /> <path d=\"m17.66 17.66 1.41 1.41\" /> <path d=\"M2 12h2\" /> <path d=\"M20 12h2\" /> <path d=\"m6.34 17.66-1.41 1.41\" /> <path d=\"m19.07 4.93-1.41 1.41\" /> </svg>","moon":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401\" /> </svg>","external-link":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M15 3h6v6\" /> <path d=\"M10 14 21 3\" /> <path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\" /> </svg>","arrow-up":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m5 12 7-7 7 7\" /> <path d=\"M12 19V5\" /> </svg>","arrow-down":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v14\" /> <path d=\"m19 12-7 7-7-7\" /> </svg>","arrow-up-down":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 16-4 4-4-4\" /> <path d=\"M17 20V4\" /> <path d=\"m3 8 4-4 4 4\" /> <path d=\"M7 4v16\" /> </svg>","search-x":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m13.5 8.5-5 5\" /> <path d=\"m8.5 8.5 5 5\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" /> <path d=\"m21 21-4.3-4.3\" /> </svg>","circle-check":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"m16 9-5.5 5.5L8 12\" /> </svg>","search":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 21-4.34-4.34\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" /> </svg>","chevron-right":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m9 18 6-6-6-6\" /> </svg>","x":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M18 6 6 18\" /> <path d=\"m6 6 12 12\" /> </svg>","arrow-left":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m12 19-7-7 7-7\" /> <path d=\"M19 12H5\" /> </svg>","arrow-right":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/></svg>"};</script>
<script>/* 扫描报告：渲染与交互。数据在 window.REPORT，图标在 window.ICONS（构建时注入）。 */
(function () {
  const R = window.REPORT;
  const root = document.getElementById('app');
  const TITLE = R.title || '代码扫描报告';

  const SEV = [
    { id: 'blocker', label: '阻断' },
    { id: 'high', label: '严重' },
    { id: 'medium', label: '一般' },
    { id: 'low', label: '提示' },
  ];
  const SEV_RANK = Object.fromEntries(SEV.map((s, i) => [s.id, i]));
  const SEV_BY_ID = Object.fromEntries(SEV.map((s) => [s.id, s]));
  const TYPE_BY_ID = Object.fromEntries(R.types.map((t) => [t.id, t]));

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (name) => `<span class="ic" aria-hidden="true">${window.ICONS[name] || ''}</span>`;
  const ext = (url, inner, cls = '') => (url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="${cls}">${inner}</span>`);
  const appHref = (a) => `#/app/${encodeURIComponent(a.id)}`;

  const countBySev = (issues) => {
    const c = { blocker: 0, high: 0, medium: 0, low: 0 };
    for (const i of issues) c[i.severity]++;
    return c;
  };

  const scanDay = Date.parse(String(R.scannedAt || '').slice(0, 10));
  const ageOf = (date) => {
    const t = Date.parse(date);
    return Number.isNaN(t) || Number.isNaN(scanDay) ? null : Math.max(0, Math.round((scanDay - t) / 86400000));
  };
  const ago = (days) => {
    if (days === null || days === undefined) return '';
    if (days <= 0) return '当天';
    if (days < 30) return `${days} 天前`;
    if (days < 365) return `${Math.floor(days / 30)} 个月前`;
    const y = Math.floor(days / 365);
    const m = Math.floor((days - y * 365) / 30);
    return m ? `${y} 年 ${m} 个月前` : `${y} 年前`;
  };

  const apps = R.apps.map((a) => {
    const issues = (a.issues || []).map((i) => ({
      ...i,
      severity: i.severity || TYPE_BY_ID[i.type].severity,
      age: i.introducedAt ? ageOf(i.introducedAt) : null,
      app: a,
    }));
    const app = { ...a, issues, total: issues.length, sev: countBySev(issues) };
    for (const i of issues) i.app = app;
    return app;
  });
  const dirty = apps.filter((a) => a.total > 0);
  const clean = apps.filter((a) => a.total === 0);
  const allIssues = apps.flatMap((a) => a.issues);
  const totals = countBySev(allIssues);
  const total = allIssues.length;
  const maxAppTotal = Math.max(1, ...dirty.map((a) => a.total));
  const hasTeam = apps.some((a) => a.team);
  const hasDate = allIssues.some((i) => i.introducedAt);
  // 默认顺序：阻断多的在前，其次问题多的在前。详情页的上一个/下一个也按这个顺序。
  const ranked = [...dirty].sort((a, b) => b.sev.blocker - a.sev.blocker || b.total - a.total);

  const freshDetail = () => ({ q: '', sev: null, type: null, mode: 'type', dir: 'desc' });
  const state = { list: { q: '', sort: 'blocker', dir: 'desc' }, detail: freshDetail() };

  /* ---------- 公共片段 ---------- */

  function sevbar(counts, cls = '', scale = 1) {
    const present = SEV.filter((s) => counts[s.id]);
    if (!present.length) return '';
    const label = present.map((s) => `${s.label} ${counts[s.id]}`).join('，');
    return `<div class="sevbar ${cls}" role="img" aria-label="${label}" style="width:${Math.max(scale * 100, 3)}%">${present
      .map((s) => `<span data-sev="${s.id}" title="${s.label} ${counts[s.id]}" style="flex:${counts[s.id]} 0 0"></span>`)
      .join('')}</div>`;
  }

  const sevTag = (id) => `<span class="sev" data-sev="${id}"><i></i>${SEV_BY_ID[id].label}</span>`;

  function topbar() {
    const dark = document.documentElement.classList.contains('dark');
    const tip = dark ? '切换到浅色' : '切换到深色';
    const repo = R.repo || {};
    return `
    <header class="topbar">
      <a class="brand" href="#/">${esc(TITLE)}</a>
      <div class="meta">
        ${repo.name ? `<span>${icon('folder-git-2')}${ext(repo.url, esc(repo.name), 'mono')}</span>` : ''}
        ${R.branch ? `<span>${icon('git-branch')}<span class="mono">${esc(R.branch)}</span></span>` : ''}
        ${R.commit ? `<span>${icon('git-commit-horizontal')}<span class="mono">${esc(R.commit)}</span></span>` : ''}
        ${R.scannedAt ? `<span>${icon('clock')}扫描于 <span class="num">${esc(R.scannedAt)}</span></span>` : ''}
      </div>
      <button type="button" class="iconbtn" data-action="theme" aria-label="${tip}" title="${tip}">${icon(dark ? 'sun' : 'moon')}</button>
    </header>`;
  }

  // 四个严重程度的数字块。onPick 存在时是筛选按钮（详情页），否则是静态数字。
  function sevTiles(counts, sum, active, clickable) {
    return `<div class="tiles">${SEV.map((s) => {
      const n = counts[s.id];
      const pct = sum ? Math.round((n / sum) * 100) : 0;
      const inner = `<span class="tile-label"><i></i>${s.label}</span><span class="tile-num">${n}</span><span class="tile-pct">${n ? `占 ${pct < 1 ? '&lt;1' : pct}%` : '无'}</span>`;
      return clickable
        ? `<button type="button" class="tile" data-sev="${s.id}" data-pick-sev="${s.id}" aria-pressed="${active === s.id}" ${n ? '' : 'disabled'} title="只看${s.label}问题">${inner}</button>`
        : `<div class="tile" data-sev="${s.id}" ${n ? '' : 'data-zero'}>${inner}</div>`;
    }).join('')}</div>`;
  }

  // 种类分布：按严重程度从高到低，同级按数量。clickable 时点击可筛选。
  function typeBars(issues, active, clickable) {
    const rows = R.types
      .map((t) => ({ ...t, n: issues.filter((i) => i.type === t.id).length }))
      .filter((t) => t.n)
      .sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity] || b.n - a.n);
    if (!rows.length) return '';
    const max = Math.max(...rows.map((t) => t.n));
    const tag = clickable ? 'button type="button"' : 'div';
    return `<div class="types">${rows.map((t) => `
      <${tag} class="type-row" data-sev="${t.severity}" ${clickable ? `data-pick-type="${esc(t.id)}" aria-pressed="${active === t.id}" title="只看「${esc(t.label)}」"` : ''}>
        <span class="type-name">${esc(t.label)}</span>
        <span class="type-track"><span class="type-fill" style="width:${(t.n / max) * 100}%"></span></span>
        <span class="type-n num">${t.n}</span>
      </${clickable ? 'button' : 'div'}>`).join('')}</div>`;
  }

  function loc(i, prefix) {
    const short = prefix && i.file.startsWith(prefix) ? i.file.slice(prefix.length) : i.file;
    const cut = short.lastIndexOf('/') + 1;
    const text = `<span class="loc-dir">${esc(short.slice(0, cut))}</span><span class="loc-file">${esc(short.slice(cut))}${i.line ? `:${i.line}` : ''}</span>`;
    return i.url
      ? `<a class="loc mono" href="${esc(i.url)}" target="_blank" rel="noopener" title="在代码仓库中打开 ${esc(i.file)}${i.line ? `:${i.line}` : ''}">${text}${icon('external-link')}</a>`
      : `<span class="loc mono">${text}</span>`;
  }

  const when = (i) => (i.introducedAt ? `<span class="num">${esc(i.introducedAt)}</span><span class="sub">${ago(i.age)}</span>` : '<span class="sub">未知</span>');
  const who = (i) => `${i.author ? esc(i.author) : ''}${i.mr ? `<span class="sub mono">${esc(i.mr)}</span>` : ''}`;

  function sortTh(scope, key, label, cls = '') {
    const s = state[scope];
    const on = s.sort === key;
    return `<th scope="col" class="${cls}" ${on ? `aria-sort="${s.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>
      <button type="button" class="sortbtn" data-sort="${scope}:${key}" ${on ? 'data-on' : ''} title="按${label}排序">${label}${icon(on ? (s.dir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down')}</button></th>`;
  }

  const empty = (text, action) => `<div class="empty">${icon('search-x')}<strong>${text}</strong><button type="button" class="btn" data-action="${action}">清除筛选</button></div>`;

  /* ---------- 列表页 ---------- */

  function listTable() {
    const { q, sort, dir } = state.list;
    const kw = q.trim().toLowerCase();
    const key = sort === 'total' ? (a) => a.total : (a) => a.sev[sort] * 100000 + a.total;
    const rows = dirty
      .filter((a) => !kw || [a.id, a.name, a.path, a.team].some((v) => v && String(v).toLowerCase().includes(kw)))
      .sort((a, b) => (dir === 'asc' ? key(a) - key(b) : key(b) - key(a)));
    if (!rows.length) return empty('没有匹配的子应用', 'reset-list');
    const n = (v, sev) => (v ? `<td class="n"${sev ? ` data-sev="${sev}"` : ''}>${v}</td>` : '<td class="n zero">0</td>');
    return `
    <table class="tbl tbl-apps">
      <thead><tr>
        <th scope="col">子应用</th>
        ${hasTeam ? '<th scope="col" class="narrow-hide">负责团队</th>' : ''}
        ${SEV.map((s) => sortTh('list', s.id, s.label, 'n')).join('')}
        ${sortTh('list', 'total', '合计', 'n')}
        <th scope="col" class="bar-col narrow-hide">分布</th>
      </tr></thead>
      <tbody>${rows.map((a) => `
        <tr data-href="${appHref(a)}">
          <td><a class="app-name" href="${appHref(a)}">${esc(a.name)}</a>${a.path ? `<span class="app-path mono">${esc(a.path)}</span>` : ''}</td>
          ${hasTeam ? `<td class="narrow-hide muted">${esc(a.team || '')}</td>` : ''}
          ${n(a.sev.blocker, 'blocker')}${n(a.sev.high)}${n(a.sev.medium)}${n(a.sev.low)}
          <td class="n total">${a.total}</td>
          <td class="bar-col narrow-hide">${sevbar(a.sev, 'sm', a.total / maxAppTotal)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  function blockerTable() {
    const rows = allIssues.filter((i) => i.severity === 'blocker').sort((a, b) => ranked.indexOf(a.app) - ranked.indexOf(b.app) || (a.age ?? 1e9) - (b.age ?? 1e9));
    if (!rows.length) return '';
    return `
    <section class="section" id="blockers">
      <div class="section-head"><h2>全部阻断问题<small>${rows.length} 个，需在发布前修复</small></h2></div>
      <div class="tbl-wrap"><table class="tbl tbl-issues">
        <thead><tr><th scope="col">子应用</th><th scope="col">问题</th><th scope="col">代码位置</th>${hasDate ? '<th scope="col">引入时间</th><th scope="col" class="narrow-hide">引入人</th>' : ''}</tr></thead>
        <tbody>${rows.map((i) => `
          <tr>
            <td class="nowrap"><a class="app-name" href="${appHref(i.app)}">${esc(i.app.name)}</a></td>
            <td><span class="issue-type">${esc(TYPE_BY_ID[i.type].label)}</span>${i.message ? `<span class="issue-msg">${esc(i.message)}</span>` : ''}</td>
            <td>${loc(i, i.app.path ? i.app.path.replace(/\/?$/, '/') : '')}</td>
            ${hasDate ? `<td class="when">${when(i)}</td><td class="who narrow-hide">${who(i)}</td>` : ''}
          </tr>`).join('')}
        </tbody>
      </table></div>
    </section>`;
  }

  // 一句话结论：阻断问题在哪些子应用。
  function lead() {
    const withBlocker = ranked.filter((a) => a.sev.blocker);
    if (!withBlocker.length) return `<p class="lead">${dirty.length} 个子应用存在问题，<strong>没有阻断级问题</strong>。</p>`;
    return `<p class="lead"><strong class="danger">${totals.blocker} 个阻断问题</strong>集中在 ${withBlocker.length} 个子应用：${withBlocker
      .map((a) => `<a href="${appHref(a)}">${esc(a.name)}</a> <span class="num">${a.sev.blocker}</span>`)
      .join('、')}。<a class="jump" href="#blockers" data-action="jump-blockers">查看明细${icon('arrow-down')}</a></p>`;
  }

  function renderList() {
    if (!total) {
      root.innerHTML = `${topbar()}<div class="empty big">${icon('circle-check')}<strong>未发现问题</strong><span>已扫描 ${apps.length} 个子应用</span></div>`;
      return;
    }
    root.innerHTML = `
    ${topbar()}
    <section class="overview" aria-label="概览">
      <div class="ov-main">
        <div class="headline">
          <div class="big-stat"><span class="big-num">${total}</span><span class="big-label">个问题</span></div>
          <div class="big-stat"><span class="big-num">${dirty.length}<small>/ ${apps.length}</small></span><span class="big-label">个子应用受影响</span></div>
        </div>
        ${sevbar(totals, 'lg')}
        ${sevTiles(totals, total, null, false)}
        ${lead()}
      </div>
      <div class="ov-side">
        <h2 class="side-title">问题种类</h2>
        ${typeBars(allIssues, null, false)}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>存在问题的子应用<small>${dirty.length} 个，点击查看问题明细</small></h2>
        <label class="search">${icon('search')}<span class="sr-only">搜索子应用</span>
          <input type="search" placeholder="搜索名称、路径或团队" value="${esc(state.list.q)}" data-input="list-q"></label>
      </div>
      <div class="tbl-wrap" id="list-table">${listTable()}</div>
      ${clean.length ? `
      <details class="clean">
        <summary>${icon('chevron-right')}${icon('circle-check')}另有 ${clean.length} 个子应用未发现问题</summary>
        <ul>${clean.map((a) => `<li>${esc(a.name)}${a.path ? `<span class="mono">${esc(a.path)}</span>` : ''}</li>`).join('')}</ul>
      </details>` : ''}
    </section>
    ${blockerTable()}
    ${R.footnote ? `<footer class="footer">${esc(R.footnote)}</footer>` : ''}`;
  }

  /* ---------- 详情页 ---------- */

  function detailRows(app) {
    const { q, sev, type } = state.detail;
    const kw = q.trim().toLowerCase();
    return app.issues.filter(
      (i) =>
        (!sev || i.severity === sev) &&
        (!type || i.type === type) &&
        (!kw || [TYPE_BY_ID[i.type].label, SEV_BY_ID[i.severity].label, i.message, i.file, i.author, i.mr].some((v) => v && String(v).toLowerCase().includes(kw)))
    );
  }

  function detailTable(app) {
    const { mode, dir } = state.detail;
    const rows = detailRows(app);
    if (!rows.length) return empty('没有符合条件的问题', 'reset-detail');
    const prefix = app.path ? app.path.replace(/\/?$/, '/') : '';
    // dir=desc 表示最近引入的在前。
    const byTime = (a, b) => (dir === 'desc' ? (a.age ?? 1e9) - (b.age ?? 1e9) : (b.age ?? -1) - (a.age ?? -1));
    const timeTh = hasDate
      ? `<th scope="col" aria-sort="${dir === 'desc' ? 'descending' : 'ascending'}"><button type="button" class="sortbtn" data-on data-action="flip-time" title="切换引入时间的先后顺序">引入时间${icon(dir === 'desc' ? 'arrow-down' : 'arrow-up')}</button></th><th scope="col" class="narrow-hide">引入人</th>`
      : '';
    const tail = (i) => `<td>${loc(i, prefix)}</td>${hasDate ? `<td class="when">${when(i)}</td><td class="who narrow-hide">${who(i)}</td>` : ''}`;

    let body;
    if (mode === 'type') {
      const groups = R.types
        .map((t) => ({ t, items: rows.filter((i) => i.type === t.id).sort(byTime) }))
        .filter((g) => g.items.length)
        .sort((a, b) => SEV_RANK[a.items[0].severity] - SEV_RANK[b.items[0].severity] || b.items.length - a.items.length);
      body = groups.map((g) => `
        <tbody>
          <tr class="grp" data-sev="${g.items[0].severity}"><th colspan="${hasDate ? 4 : 2}" scope="colgroup">${sevTag(g.items[0].severity)}<span class="grp-name">${esc(g.t.label)}</span><span class="grp-n">${g.items.length} 个</span></th></tr>
          ${g.items.map((i) => `<tr><td class="msg">${i.severity !== g.items[0].severity ? sevTag(i.severity) : ''}${esc(i.message || g.t.label)}</td>${tail(i)}</tr>`).join('')}
        </tbody>`).join('');
    } else {
      body = `<tbody>${[...rows].sort(byTime).map((i) => `
        <tr><td class="msg"><span class="issue-type">${sevTag(i.severity)}${esc(TYPE_BY_ID[i.type].label)}</span>${i.message ? `<span class="issue-msg">${esc(i.message)}</span>` : ''}</td>${tail(i)}</tr>`).join('')}</tbody>`;
    }
    return `
    <table class="tbl tbl-issues" data-mode="${mode}">
      <thead><tr><th scope="col">问题</th><th scope="col">代码位置</th>${timeTh}</tr></thead>
      ${body}
    </table>`;
  }

  function detailToolbar(app) {
    const { sev, type, mode } = state.detail;
    const n = detailRows(app).length;
    const filtered = sev || type || state.detail.q.trim();
    const chips = [sev ? `<button type="button" class="chip" data-pick-sev="${sev}" title="取消筛选">${SEV_BY_ID[sev].label}${icon('x')}</button>` : '', type ? `<button type="button" class="chip" data-pick-type="${esc(type)}" title="取消筛选">${esc(TYPE_BY_ID[type].label)}${icon('x')}</button>` : ''].join('');
    return `
      <h2>问题明细<small>${filtered ? `显示 ${n} / ${app.total} 个` : `${app.total} 个`}</small>${chips}</h2>
      <div class="tools">
        <div class="seg" role="group" aria-label="排列方式">
          <button type="button" data-mode="type" aria-pressed="${mode === 'type'}">按种类分组</button>
          <button type="button" data-mode="time" aria-pressed="${mode === 'time'}">按引入时间</button>
        </div>
        <label class="search">${icon('search')}<span class="sr-only">搜索问题</span>
          <input type="search" placeholder="搜索说明、文件或引入人" value="${esc(state.detail.q)}" data-input="detail-q"></label>
      </div>`;
  }

  function renderDetail(app) {
    const idx = ranked.indexOf(app);
    const prev = ranked[idx - 1];
    const next = ranked[idx + 1];
    const oldest = app.issues.reduce((m, i) => (i.age !== null && (m === null || i.age > m.age) ? i : m), null);
    const facts = [
      app.team ? `<span><span class="muted">负责团队</span>${esc(app.team)}</span>` : '',
      app.path ? `<span><span class="muted">目录</span>${ext(app.url, esc(app.path), 'mono link')}</span>` : '',
      oldest ? `<span><span class="muted">最早的问题引入于</span><span class="num">${esc(oldest.introducedAt)}</span></span>` : '',
    ].join('');
    const pager = (a, label, ic, cls) => (a ? `<a class="pager ${cls}" href="${appHref(a)}" title="${label}：${esc(a.name)}">${cls === 'prev' ? icon(ic) : ''}<span>${esc(a.name)}</span>${cls === 'next' ? icon(ic) : ''}</a>` : '');
    root.innerHTML = `
    ${topbar()}
    <div class="crumbs">
      <a class="back" href="#/">${icon('arrow-left')}全部子应用</a>
      <span class="pagers"><span class="muted num">${idx + 1} / ${ranked.length}</span>${pager(prev, '上一个', 'arrow-left', 'prev')}${pager(next, '下一个', 'arrow-right', 'next')}</span>
    </div>
    <section class="overview" aria-label="概览">
      <div class="ov-main">
        <h1 class="title">${esc(app.name)}<span class="title-n"><b class="num">${app.total}</b> 个问题</span></h1>
        <div class="facts">${facts}</div>
        ${sevbar(app.sev, 'lg')}
        <div id="detail-tiles">${sevTiles(app.sev, app.total, state.detail.sev, true)}</div>
      </div>
      <div class="ov-side">
        <h2 class="side-title">问题种类<small>点击筛选</small></h2>
        <div id="detail-types">${typeBars(app.issues, state.detail.type, true)}</div>
      </div>
    </section>

    <section class="section">
      <div class="section-head" id="detail-toolbar">${detailToolbar(app)}</div>
      <div class="tbl-wrap" id="detail-table">${detailTable(app)}</div>
    </section>
    ${R.footnote ? `<footer class="footer">${esc(R.footnote)}</footer>` : ''}`;
  }

  /* ---------- 路由与事件 ---------- */

  function currentApp() {
    const m = location.hash.match(/^#\/app\/(.+)$/);
    if (!m) return null;
    let id = m[1];
    try { id = decodeURIComponent(id); } catch (_) {}
    return apps.find((a) => String(a.id) === id && a.total > 0) || null;
  }

  function render() {
    const app = currentApp();
    if (app) renderDetail(app);
    else renderList();
    document.title = app ? `${app.name} | ${TITLE}` : TITLE;
  }

  let lastApp = null;
  window.addEventListener('hashchange', () => {
    if (location.hash === '#blockers') return;
    const app = currentApp();
    if (app && app.id !== lastApp) state.detail = freshDetail();
    lastApp = app ? app.id : null;
    render();
    window.scrollTo(0, 0);
  });

  const refreshList = () => (document.getElementById('list-table').innerHTML = listTable());
  function refreshDetail(keepSearchFocus) {
    const app = currentApp();
    document.getElementById('detail-table').innerHTML = detailTable(app);
    document.getElementById('detail-tiles').innerHTML = sevTiles(app.sev, app.total, state.detail.sev, true);
    document.getElementById('detail-types').innerHTML = typeBars(app.issues, state.detail.type, true);
    if (keepSearchFocus) {
      // 只更新计数，不重建输入框，避免打字时丢失焦点。
      const n = detailRows(app).length;
      const filtered = state.detail.sev || state.detail.type || state.detail.q.trim();
      document.querySelector('#detail-toolbar h2 small').textContent = filtered ? `显示 ${n} / ${app.total} 个` : `${app.total} 个`;
    } else {
      document.getElementById('detail-toolbar').innerHTML = detailToolbar(app);
    }
  }

  root.addEventListener('input', (e) => {
    const k = e.target.dataset.input;
    if (k === 'list-q') { state.list.q = e.target.value; refreshList(); }
    if (k === 'detail-q') { state.detail.q = e.target.value; refreshDetail(true); }
  });

  root.addEventListener('click', (e) => {
    const t = e.target;
    const sortEl = t.closest('[data-sort]');
    if (sortEl) {
      const key = sortEl.dataset.sort.split(':')[1];
      const s = state.list;
      if (s.sort === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.sort = key; s.dir = 'desc'; }
      refreshList();
      return;
    }
    const sevEl = t.closest('[data-pick-sev]');
    if (sevEl) {
      const v = sevEl.dataset.pickSev;
      state.detail.sev = state.detail.sev === v ? null : v;
      refreshDetail();
      return;
    }
    const typeEl = t.closest('[data-pick-type]');
    if (typeEl) {
      const v = typeEl.dataset.pickType;
      state.detail.type = state.detail.type === v ? null : v;
      refreshDetail();
      return;
    }
    const modeEl = t.closest('[data-mode]');
    if (modeEl && modeEl.tagName === 'BUTTON') {
      state.detail.mode = modeEl.dataset.mode;
      refreshDetail();
      return;
    }
    const action = t.closest('[data-action]');
    if (action) {
      const a = action.dataset.action;
      if (a === 'theme') {
        const dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('report-theme', dark ? 'dark' : 'light'); } catch (_) {}
        render();
      }
      if (a === 'flip-time') { state.detail.dir = state.detail.dir === 'desc' ? 'asc' : 'desc'; refreshDetail(); }
      if (a === 'reset-list') { state.list.q = ''; render(); }
      if (a === 'reset-detail') { state.detail = { ...freshDetail(), mode: state.detail.mode }; render(); }
      if (a === 'jump-blockers') {
        e.preventDefault();
        const el = document.getElementById('blockers');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      return;
    }
    const row = t.closest('tr[data-href]');
    if (row && !t.closest('a, button')) location.hash = row.dataset.href;
  });

  lastApp = currentApp() ? currentApp().id : null;
  render();
})();
</script>
</body>
</html>
